services:
  mysql:
    image: mysql:8.4
    container_name: student-complaint-mysql
    environment:
      MYSQL_ROOT_PASSWORD: student_root_password
      MYSQL_DATABASE: student_complaint_system
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/railway_students.sql:/docker-entrypoint-initdb.d/01-students.sql:ro
      - ../database/railway_admins.sql:/docker-entrypoint-initdb.d/02-admins.sql:ro
      - ../database/railway_complaints.sql:/docker-entrypoint-initdb.d/03-complaints.sql:ro
    restart: unless-stopped

  backend:
    build: .
    container_name: student-complaint-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: student-complaint-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data: